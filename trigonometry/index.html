<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trigonometry Simulation Labs</title><link rel="stylesheet" href="styles.css"></head><body><header><span class="eyebrow">Interactive course</span><h1>Trigonometry simulation labs</h1><p class="idea">Choose a concept, move the controls, and learn from the picture.</p></header><main><section class="panel"><div id="labs" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px"></div></section></main><script>const names=['Angles and Turns','Degrees and Radians','Right Triangles','Similar Triangles','Sine as a Ratio','Cosine as a Ratio','Tangent as a Ratio','SOH–CAH–TOA','Finding a Missing Side','Inverse Sine','Inverse Cosine','Inverse Tangent','Angle of Elevation','Angle of Depression','The Unit Circle','Quadrants and Signs','Reference Angles','Special Angle Values','The Pythagorean Identity','Complementary Angles','The Sine Wave','The Cosine Wave','Amplitude','Period','Phase Shift','Vertical Shift','Law of Sines','Law of Cosines','Triangle Area with Sine','Bearings'];document.querySelector('#labs').innerHTML=names.map((n,i)=>`<a class="back" style="padding:12px;border:1px solid var(--line);border-radius:10px" href="${String(i+1).padStart(2,'0')}-${['angles-and-turns','degrees-and-radians','right-triangles','similar-triangles','sine-as-a-ratio','cosine-as-a-ratio','tangent-as-a-ratio','soh-cah-toa','finding-a-missing-side','inverse-sine','inverse-cosine','inverse-tangent','angle-of-elevation','angle-of-depression','unit-circle','quadrants-and-signs','reference-angles','special-angle-values','pythagorean-identity','complementary-angle-identities','sine-wave','cosine-wave','amplitude','period','phase-shift','vertical-shift','law-of-sines','law-of-cosines','triangle-area-with-sine','bearings'][i]}/">${i+1}. ${n}</a>`).join('')</script></body></html>
